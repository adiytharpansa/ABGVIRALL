<html lang="id">
<head>

<style>
:root{--bg:#F4F6FA;--surface:#fff;--surface2:#E8ECF4;--text:#141A2B;--muted:#5B6479;--line:#D9DFEB;--accent:#3550F0;--accent-ink:#fff;--live:#12A67A;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1320;--surface:#171C2E;--surface2:#222942;--text:#EDF0FA;--muted:#9AA3BC;--line:#2A3250;--accent:#7C92FF;--accent-ink:#0F1320;--live:#3DDBA8}}
:root[data-theme="dark"]{--bg:#0F1320;--surface:#171C2E;--surface2:#222942;--text:#EDF0FA;--muted:#9AA3BC;--line:#2A3250;--accent:#7C92FF;--accent-ink:#0F1320;--live:#3DDBA8}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;height:68px;padding:0 22px;box-shadow:0 1px 0 var(--line),0 10px 28px -20px rgba(8,12,28,.5);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),#a855f7,#ec4899);opacity:.8}
.hl,.hr{flex:1;display:flex;align-items:center;gap:6px;min-width:0}.hr{justify-content:flex-end}
.btn.out{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);padding:8px 18px;border-radius:999px;font-weight:600}.btn.out:hover{filter:brightness(1.1)}
.me{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ec4899);color:var(--accent-ink);font:700 13px var(--fd);display:none;place-items:center}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic:hover{background:var(--surface2)}
.logo{font:800 22px var(--fd);letter-spacing:-.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo i{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#a855f7);box-shadow:0 5px 14px -5px var(--accent);display:grid;place-items:center}
.logo i:after{content:"";border-left:9px solid var(--accent-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.search{flex:2;max-width:620px;height:44px;box-shadow:0 1px 3px rgba(8,12,28,.06);display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;padding:9px 16px;outline:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search button{padding:0 18px;background:var(--surface2);border-left:1px solid var(--line)}
.layout{display:flex}
nav{width:220px;flex:none;padding:12px 8px;position:sticky;top:69px;height:calc(100vh - 69px);overflow:auto}
nav.min{width:72px}
nav a{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--surface2)}
nav a.on{background:var(--surface2);font-weight:600}
nav.min a span{display:none}
nav h4{font:600 13px var(--fb);color:var(--muted);padding:16px 14px 6px}
nav.min h4{display:none}
main{flex:1;min-width:0;padding:16px 20px 48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none}
.chip{padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(8,12,28,.04)}
.chip.on{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px var(--accent)}
.hero{display:block;position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);margin-bottom:30px;cursor:pointer;box-shadow:0 24px 48px -24px rgba(4,7,18,.55)}
.hero .th{aspect-ratio:16/9;border-radius:0}
@media(min-width:761px){.hero .th{aspect-ratio:21/9}}
.hero .tx{position:absolute;left:0;right:0;bottom:0;padding:70px 30px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;background:linear-gradient(transparent,rgba(3,5,13,.88) 62%);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:600;font-size:14px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.hero h1{font:800 clamp(24px,3vw,40px)/1.08 var(--fd);letter-spacing:-1px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.hero .tx .muted{color:rgba(255,255,255,.8)}
.hero .tx .live{color:#4ade80}
.muted{color:var(--muted);font-size:14px}
#src{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:fit-content}
.btn.alt{background:var(--surface2);color:var(--text)}
.btn.alt.on{background:var(--text);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 16px}
.card{cursor:pointer;display:block;text-align:left;width:100%}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;transition:border-radius .2s}
.card:hover .th{border-radius:4px}
.th svg{position:absolute;inset:0;width:100%;height:100%}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(10,12,20,.82);color:#fff;font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px}
.meta{display:flex;gap:12px;padding-top:12px}
.av{width:36px;height:36px;border-radius:50%;flex:none;font:700 14px var(--fd);display:grid;place-items:center;color:#fff}
.meta b{display:block;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
#watch{display:none}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
.player{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.player .th{position:absolute;inset:0;border-radius:0;aspect-ratio:auto}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:32px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;display:flex;flex-direction:column;gap:8px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.3);cursor:pointer;overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent)}
.crow{display:flex;align-items:center;gap:12px;font-size:13px}
.player .fs{position:absolute;top:10px;right:10px;z-index:6;width:40px;height:40px;border-radius:10px;background:rgba(7,9,17,.55);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.player .fs:hover{background:rgba(7,9,17,.85)}
#pl:fullscreen{border-radius:0;background:#000}
.big{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(10,12,20,.6);display:grid;place-items:center;color:#fff}
.player.play .big{opacity:0}
.wtitle{font:700 22px/1.25 var(--fd);margin:16px 0 12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .grow{flex:1;min-width:140px}
.desc{background:var(--surface2);border-radius:14px;padding:14px;margin:16px 0}
.cm{display:flex;gap:12px;margin:18px 0}
.side .card{display:flex;gap:10px;margin-bottom:12px}
.side .th{width:168px;flex:none}
.side .meta{padding:0;flex-direction:column;gap:2px}
@media(max-width:1000px){.wgrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media(max-width:760px){nav{position:fixed;left:0;top:69px;z-index:15;background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;width:220px}
nav.open{transform:none}main{padding:12px}header{padding:0 10px;gap:8px}.search button{display:none}.hr .btn{display:none}.logo b{font-size:16px}.me{display:grid}.hl{flex:none}.hero .tx{padding:46px 18px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let V=SAMPLE;const subs=new Set(),liked=new Set();let cat="Semua",term="",timer=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const initial=c=>c.split(" ").map(w=>w[0]).slice(0,2).join("");
const col=c=>`hsl(${[...c].reduce((a,x)=>a+x.charCodeAt(0),0)%360} 55% 45%)`;
function thumb(v,i){const[a,b]=v.h;const yid=ytId(v.u);if(yid)return `<div class="th"><img src="https://i.ytimg.com/vi/${yid}/hqdefault.jpg" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span class="dur" ${v.f?'style="background:var(--live);color:#06231a"':''}>${v.d}</span></div>`;return `<div class="th"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a} 70% 52%)"/><stop offset="1" stop-color="hsl(${b} 75% 28%)"/></linearGradient></defs><rect width="320" height="180" fill="url(#g${i})"/><circle cx="${230+i*7%60}" cy="${40+i*13%50}" r="${50+i*9%40}" fill="hsl(${b} 80% 70%)" opacity=".28"/><path d="M0 ${130+i%3*10} Q80 ${90+i%4*8} 160 ${125} T320 ${110+i%5*6} V180 H0z" fill="hsl(${a} 60% 18%)" opacity=".55"/></svg><span class="dur" ${v.f?'style="background:var(--live);color:#06231a"':''}>${v.d}</span></div>`}
function card(v,i,side){return `<button class="card" data-i="${i}"><div class="th-w">${thumb(v,i)}</div><div class="meta">${side?'':`<div class="av" style="background:${col(v.c)}">${initial(v.c)}</div>`}<div><b>${esc(v.t)}</b><span class="muted">${v.c}<br>${v.v} x ditonton · ${v.w}</span></div></div></button>`}
function list(){return V.map((v,i)=>({v,i})).filter(({v})=>(cat=="Semua"||cat=="Sedang tren"||cat=="Langganan"?(cat=="Langganan"?subs.has(v.c):true):v.k==cat)&&(v.t+v.c).toLowerCase().includes(term.toLowerCase()))}
function renderBrowse(){
 const cats=["Semua",...new Set(V.map(v=>v.k))];
 $("#chips").innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-cat="${c}">${c}</button>`).join("");
 const L=list();const showHero=cat=="Semua"&&!term;
 $("#heroWrap").innerHTML=showHero?`<div class="hero" data-i="0" tabindex="0" role="button">${thumb(V[0],0)}<div class="tx">${V[0].f?`<span class="live">Sedang tayang · ${V[0].v} penonton</span>`:`<span class="muted">Pilihan utama</span>`}<h1>${esc(V[0].t)}</h1><p class="muted">${V[0].c}${V[0].s?" · "+V[0].s+" pelanggan":""}</p><span class="btn">Tonton sekarang</span></div></div>`:"";
 const items=showHero?L.filter(x=>x.i):L;
 $("#grid").innerHTML=items.length?items.map(({v,i})=>card(v,i)).join(""):`<div class="empty" style="grid-column:1/-1">${cat=="Langganan"?"Kamu belum berlangganan kanal apa pun. Buka sebuah video dan pilih Berlangganan.":"Tidak ada video yang cocok. Coba kata kunci lain."}</div>`;
}
function ytId(u){const m=String(u||"").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:null}
function luluId(u){const m=String(u||"").match(/(?:lulu(?:stream|vdo+)?\.(?:com|st)|streamhihi\.com|cdn1\.site)\/(?:e\/|d\/|embed-)?([0-9a-zA-Z]{8,})/i);return m?m[1]:null}
function embedFor(u){const s=String(u||"");const y=ytId(s);if(y)return{t:"yt",src:"https://www.youtube-nocookie.com/embed/"+y+"?rel=0&modestbranding=1&playsinline=1"};const l=luluId(s);if(l)return{t:"iframe",src:"https://lulustream.com/e/"+l};const f=s.match(/<iframe[^>]+src="([^"]+)"/i);if(f&&/^https?:\/\//i.test(f[1]))return{t:"iframe",src:f[1]};if(/^https?:\/\//i.test(s)&&/\.(mp4|webm|m3u8)(\?|#|$)/i.test(s))return{t:"file",src:s};return null}
function playerHTML(emb,v,i){if(!emb)return thumb(v,i);if(emb.t=="file")return `<video src="${emb.src}" controls autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;background:#000"></video>`;return `<iframe src="${emb.src}" title="${esc(v.t)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
function secs(d){const p=String(d).split(":").map(Number);return p.some(isNaN)?600:p.reduce((a,x)=>a*60+x,0)}
function fmt(s){const m=Math.floor(s/60);return m+":"+String(Math.floor(s%60)).padStart(2,"0")}
function openWatch(i){
 const v=V[i],yid=ytId(v.u),emb=embedFor(v.u);clearInterval(timer);let p=0,playing=true;const total=v.f?3600:Math.max(60,secs(v.d));
 $("#browse").style.display="none";const w=$("#watch");w.style.display="block";scrollTo(0,0);
 const rel=V.map((x,j)=>({x,j})).filter(o=>o.j!=i).slice(0,7);
 w.innerHTML=`<div class="wgrid"><div><div class="player play" id="pl">${playerHTML(emb,v,i)}<button class="fs" id="fs" aria-label="Layar penuh, miringkan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>${emb?"":`<button class="big" id="pp" aria-label="Putar atau jeda"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><div class="ctrl"><div class="bar" id="bar"><div id="fill"></div></div><div class="crow"><button id="pp2" aria-label="Putar atau jeda"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="ico"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button><span id="tm">0:00 / ${v.f?'LIVE':v.d}</span></div></div>`}</div>

 <h3 style="font:700 18px var(--fd)">Komentar</h3>

 <aside class="side">${rel.map(o=>card(o.x,o.j,1)).join("")}</aside></div>`;
 if(!emb){const pl=$("#pl"),fill=$("#fill"),tm=$("#tm"),ico=$("#ico");
 const set=()=>{pl.classList.toggle("play",playing);ico.innerHTML=playing?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>'};

async function goFS(el){if(!el)return;if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}return}try{await el.requestFullscreen();if(screen.orientation&&screen.orientation.lock){try{await screen.orientation.lock('landscape')}catch(e){}}}catch(e){const v=el.querySelector('video');if(v&&v.webkitEnterFullscreen)v.webkitEnterFullscreen()}}

const SRV="Google Sheets",SID="1u2RDf6Ag8BJh7Top8UMVOc8wZlemSoCoC5KHwRkfUk4",RNG="Sheet1!A1:G500";
const KEYS={t:["judul","title"],c:["kanal","channel"],v:["tonton","ditonton","views"],w:["waktu","tayang"],d:["durasi","duration"],k:["kategori","category"],u:["link_video","link","url"],s:["pelanggan","subscribers"]};
function fromRows(rows){
 if(!rows.length)return null;const hd=rows[0].map(x=>String(x).trim().toLowerCase()),ix={};
 for(const k in KEYS)ix[k]=hd.findIndex(h=>KEYS[k].some(key=>h===key||h.includes(key)));
 if(ix.t<0||ix.c<0)return null;
 const g=(r,k,d)=>{const x=ix[k]>=0&&r[ix[k]]!=null?String(r[ix[k]]).trim():"";return x||d};
 let data=rows.slice(1);const pre=Object.keys(KEYS).filter(k=>{const i=ix[k];return i>=0&&KEYS[k].some(key=>hd[i].startsWith(key)&&hd[i]!==key)});if(pre.length>=6){const rec=[];for(const k in KEYS){const i=ix[k];if(i<0)continue;const cell=String(rows[0][i]||"").trim();const key=[...KEYS[k]].sort((a,b)=>b.length-a.length).find(key=>hd[i].startsWith(key));rec[i]=key?cell.slice(key.length).trim():cell}if(rec[ix.t])data=[rec,...data]}return data.filter(r=>g(r,"t","")).map(r=>{
  const k=g(r,"k","Lainnya"),d=g(r,"d","0:00"),base=[...k].reduce((a,x)=>a*31+x.charCodeAt(0),7)%360;
  return {t:g(r,"t",""),c:esc(g(r,"c","Tanpa kanal")),v:esc(g(r,"v","0")),w:esc(g(r,"w","")),d:esc(d),k:esc(k),u:g(r,"u",""),s:esc(g(r,"s","")),h:[base,(base+50)%360],f:d.toUpperCase()=="LIVE"}});
}
function renderNav(){
 $("#navcats").innerHTML=[...new Set(V.map(v=>v.k))].map(c=>`<a data-cat="${c}" class="${c==cat?"on":""}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg><span>${c}</span></a>`).join("");
}
function refresh(){
 if(cat!="Semua"&&cat!="Sedang tren"&&cat!="Langganan"&&!V.some(v=>v.k==cat))cat="Semua";
 renderNav();if($("#watch").style.display=="block")goHome();else renderBrowse();
}
let sig="";
const setSrc=t=>{$("#src").textContent=t};
function apply(p){
 const list=p&&Array.isArray(p.values)?fromRows(p.values):null,ok=list&&list.length;
 setSrc(ok?"Tersambung ke Google Sheets · "+list.length+" video":"Sheet masih kosong atau judul kolomnya belum sesuai. Menampilkan video contoh.");
 const n=JSON.stringify(ok?list:"sample");if(n===sig)return;sig=n;V=ok?list:SAMPLE;refresh();
}
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
async function loadSheet(){
 setSrc("Memuat dari Google Sheets…");
 const CSVURL="https://docs.google.com/spreadsheets/d/1u2RDf6Ag8BJh7Top8UMVOc8wZlemSoCoC5KHwRkfUk4/gviz/tq?tqx=out:csv&sheet=Sheet1";const pull=async()=>{try{const r=await fetch(CSVURL);if(!r.ok)throw new Error(r.status);const txt=await r.text();if(txt.trimStart().startsWith("<"))throw new Error("sheet tidak publik");apply({values:parseCSV(txt).filter(r=>r.some(x=>x!==""))})}catch(e){setSrc("Gagal memuat Sheet. Pastikan Sheet dibagikan sebagai 'Siapa saja yang memiliki link: Pelihat'.")}};
 pull();setInterval(pull,60000);
}
renderNav();loadSheet();
