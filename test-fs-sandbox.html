<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Player FireStream Sandbox</title>
<style>body{margin:0;background:#0b0e17;color:#fff;font-family:system-ui;padding:16px}h1{font-size:16px}.box{position:relative;max-width:860px;aspect-ratio:16/9;background:#000;margin:12px auto}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<h1>Uji: embed FireStream dengan sandbox (tanpa izin popup)</h1>
<div class="box"><iframe sandbox="allow-scripts allow-same-origin allow-presentation" src="https://firestream.to/e/BjYYFt5I" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
</body>
</html>
